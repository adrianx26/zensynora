# =============================================================================
# ZenSynora — Docs site (mkdocs-material → GitHub Pages)
# =============================================================================
# Every PR: checks that diagrams/*.html match the mermaid blocks in the docs
# (`python diagrams/generate.py`) and that `mkdocs build` succeeds.
# Push to main: also publishes site/ to the gh-pages branch.
# =============================================================================

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # peaceiris/actions-gh-pages pushes the gh-pages branch with
      # GITHUB_TOKEN; without write access the push failed (git exit 128).
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/docs.yml

      - name: Install docs dependencies
        run: python -m pip install "mkdocs-material>=9.5,<10" "pymdown-extensions>=10"

      - name: Diagram pages are up to date
        run: |
          python diagrams/generate.py
          if ! git diff --quiet -- diagrams/ || [ -n "$(git status --porcelain -- diagrams/)" ]; then
            echo "::error::diagrams/ is out of date — run 'python diagrams/generate.py' and commit the result."
            git status --short -- diagrams/
            exit 1
          fi

      - name: Build site
        run: mkdocs build

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
