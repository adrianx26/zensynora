# =============================================================================
# ZenSynora — Continuous Integration (GitHub Actions)
# =============================================================================
# Triggers: push to main, pull requests to main, manual dispatch
#
# Jobs (each one can be reproduced locally — see CONTRIBUTING.md, "CI"):
#   lint       — ruff, real-error rules only (config: pyproject [tool.ruff])
#   typecheck  — mypy myclaw/ (config: pyproject [tool.mypy])
#   test       — pytest on Python 3.11 and 3.12 (core deps + [test] extra)
#   webui      — npm ci + npm run build (tsc -b && vite build)
#   docker     — build the image, run `zensynora --help` and /health
#
# To skip CI for a commit, include "[skip ci]" in the commit message.
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  # Only rules that catch real bugs (syntax errors, undefined names, …).
  # The code is not style-clean, so no format checks here — see
  # CONTRIBUTING.md for running wider rule sets on the files you touch.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install "ruff>=0.4,<1"

      - name: ruff check
        run: ruff check --output-format=github .

  # ── Type check ──────────────────────────────────────────────────────────
  # mypy without the project's dependencies: third-party imports are Any,
  # so results do not depend on which optional packages are installed.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mypy
        run: python -m pip install "mypy>=1.9,<2"

      - name: mypy
        run: mypy myclaw/

  # ── Tests ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      # Same core dependencies the installer gets from requirements.txt
      # (pyproject mirrors them), plus pytest from the [test] extra. Optional
      # extras (jinja2, PyJWT, discord.py, …) are not installed: the tests
      # that need them use pytest.importorskip and are skipped.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
        env:
          MYCLAW_LOG_LEVEL: WARNING

  # ── Web UI build ────────────────────────────────────────────────────────
  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build (tsc -b && vite build)
        run: npm run build

  # ── Docker image ────────────────────────────────────────────────────────
  # Build only (push: false) — no registry secrets needed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: zensynora:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CLI starts
        run: docker run --rm zensynora:test zensynora --help

      - name: Web UI answers /health
        run: |
          docker run -d --name zensynora-health -p 8000:8000 zensynora:test
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health; then
              echo; echo "healthy after ${i}s"; exit_code=0; break
            fi
            exit_code=1; sleep 1
          done
          docker logs zensynora-health | tail -n 50
          docker rm -f zensynora-health >/dev/null
          exit $exit_code
