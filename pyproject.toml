[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zensynora"
version = "0.8.0"
description = "A powerful personal AI agent with multi-provider LLM support, Telegram/WhatsApp gateways, persistent memory, and agent swarms."
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [
    {name = "Adrian Petrescu", email = "adrianx26@protonmail.com"}
]
keywords = [
    "ai-agent",
    "local-llm",
    "multi-agent",
    "ollama",
    "telegram-bot",
    "whatsapp-bot",
    "personal-ai",
    "mcp",
    "swarm-intelligence",
    "automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]

# Core dependencies — installed with every ZenSynora setup.
# Optional LLM providers, extras, and integrations are below under
# [project.optional-dependencies].
dependencies = [
    "python-telegram-bot[job-queue]>=21.4,<22.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.23.0,<1.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.7,<14.0",
    "pydantic>=2.7,<3.0",
    "scrapling[all]>=0.4.2,<0.5.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "httpx[http2]>=0.27.0,<1.0",
    "numpy>=1.26.0,<3.0",
    "mcp>=1.1.2,<2.0",
    "psutil>=5.9.0,<6.0",
    "py-cpuinfo>=9.0.0,<10.0",
    "watchdog>=4.0,<5.0",
    "requests>=2.31.0,<3.0",
    "paramiko>=3.4.0,<4.0",
    # Needed by every OpenAI-compatible provider (llama.cpp, LM Studio,
    # OpenAI, Groq, OpenRouter) — not optional.
    "openai>=1.0,<3.0",
    # 2026-10-31: read PDF, Word and Excel files people send (Telegram) and
    # import into the knowledge base. Were the optional 'ingest' extra, which
    # most installs never had — a PDF sent on Telegram could not be read.
    # Small, pure Python. pypdf: BSD-3-Clause; python-docx, openpyxl: MIT.
    "pypdf>=4.0,<7.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
# LLM Provider SDKs (install only the ones you need)
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
google = ["google-generativeai>=0.5"]
all-providers = [
    "openai>=1.0",
    "anthropic>=0.25",
    "google-generativeai>=0.5",
]

# Optional features
semantic-cache = ["sentence-transformers>=2.2.2"]
voice = ["vosk>=0.3.45"]
redis = ["redis>=4.0"]
metrics = ["prometheus-client>=0.20.0"]
security = ["cryptography>=42.0.0", "keyring>=25.0.0"]
mfa = ["pyotp>=2.9.0", "qrcode>=7.4"]
# KB phase 5 (2026-10-24) — read PDF, Word and Excel files into the knowledge base
# (assimilate / import). pypdf: BSD-3-Clause; python-docx, openpyxl: MIT.
# (2026-10-31: pypdf, python-docx and openpyxl are core dependencies now; kept here for old commands)
ingest = ["pypdf>=4.0,<7.0", "python-docx>=1.1,<2.0", "openpyxl>=3.1,<4.0", "ijson>=3.2,<4.0"]
# KB phase 3 (2026-10-24) — semantic search of the knowledge base: local
# embeddings (ONNX Runtime, CPU). fastembed: Apache-2.0; default model
# BAAI/bge-small-en-v1.5 (MIT, 67 MB, downloaded on first use to ~/.myclaw/models).
semantic = ["fastembed>=0.5,<1.0"]
# KB phase 6 (2026-10-25) — live re-index of note files edited by hand (the
# Web UI's file watcher, knowledge.watch_files). watchfiles: MIT. Without it the
# watcher polls modification times every 5 s. (uvicorn[standard] usually brings it.)
watch = ["watchfiles>=0.21,<2.0"]

# Sprint 2 — distributed tracing
tracing = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]

# Sprint 3 — headless browser tooling (Playwright)
browser = ["playwright>=1.42"]

# Sprint 3 — Jinja2 prompt templates (falls back to string.Template if absent)
prompts = ["jinja2>=3.1"]

# Sprint 3 — JSON-schema validation (alternative to passing Pydantic models)
jsonschema = ["jsonschema>=4.21"]

# Sprint 4 — vector database plugins
qdrant = ["qdrant-client>=1.7"]

# Sprint 6 — JWT verification + Discord channel
auth = ["PyJWT[crypto]>=2.8"]
discord = ["discord.py>=2.3"]
slack = ["slack-bolt>=1.18"]

# Install everything
all = [
    "openai>=1.0",
    "anthropic>=0.25",
    "google-generativeai>=0.5",
    "sentence-transformers>=2.2.2",
    "vosk>=0.3.45",
    "redis>=4.0",
    "prometheus-client>=0.20.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "playwright>=1.42",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "qdrant-client>=1.7",
    "PyJWT[crypto]>=2.8",
    "discord.py>=2.3",
    "slack-bolt>=1.18",
    "pypdf>=4.0,<7.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "fastembed>=0.5,<1.0",
    "watchfiles>=0.21,<2.0",
]

# Test runner only — what CI installs for the test jobs.
test = [
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.21.0,<1.0",
    "pytest-cov>=4.0,<6.0",
]

dev = [
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.21.0,<1.0",
    "pytest-cov>=4.0,<6.0",
    "ruff>=0.4.0,<1.0",
    "black>=24.0,<26.0",
    "isort>=5.13,<6.0",
    "pre-commit>=3.7,<5.0",
    "mypy>=1.9,<2.0",
    "bandit>=1.7,<2.0",
    "safety>=2.3,<3.0",
    # Graphify (the code-graph tool used in AGENTS.md) is not on PyPI under a
    # stable name; install it separately. Listing a non-existent package here
    # made `pip install -e ".[dev]"` fail (and with it every CI job).
]

[project.scripts]
zensynora = "myclaw.cli:cli"
myclaw = "myclaw.cli:cli"

[project.urls]
Homepage = "https://github.com/adrianx26/zensynora"
Documentation = "https://github.com/adrianx26/zensynora#readme"
Repository = "https://github.com/adrianx26/zensynora"
Issues = "https://github.com/adrianx26/zensynora/issues"
Changelog = "https://github.com/adrianx26/zensynora/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["myclaw"]

[tool.hatch.build.targets.sdist]
include = [
    "/myclaw",
    "/cli.py",
    "/onboard.py",
    "/tests",
    "/docs",
    "/eval",
    "/webui",
    "/requirements.txt",
    "/install.sh",
    "/update.sh",
    "/updater",
    "/install-online.sh",
    "/uninstall.sh",
    "/cleanup.sh",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]
exclude = [
    "/docs/dev/scripts",
    "/__pycache__",
    "/.pytest_cache",
    "/.kilo",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | webui/node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["myclaw"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "Scrapling",
    "webui",
    "graphify-out",
    "docs",
    ".claude",
]

[tool.ruff.lint]
# CI gate: only rules that catch real bugs — syntax errors (E9), invalid
# comparisons (F63), misplaced statements (F7) and undefined names (F82).
# The codebase is not style-clean (thousands of W/UP/I findings); tighten
# this list module by module rather than mass-reformatting. For a wider
# local report run e.g. `ruff check --select E,W,F,I,UP,B myclaw/`.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# Plain options only, so `python -m pytest` works without pytest-cov.
# Coverage is opt-in: add `--cov=myclaw --cov-report=term`.
addopts = "-ra --tb=short"

[tool.mypy]
# CI gate: catches undefined names, bad imports and syntax errors in
# myclaw/. The codebase is only partly annotated, so the noisy error codes
# below are disabled; remove entries from disable_error_code as modules get
# cleaned up. Third-party packages are treated as Any (no stubs needed).
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
implicit_optional = true
exclude = [
    "webui/",
    "docs/",
    "tests/",
]
disable_error_code = [
    "abstract",
    "annotation-unchecked",
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "dict-item",
    "index",
    "method-assign",
    "misc",
    "no-any-return",
    "no-redef",
    "operator",
    "return-value",
    "truthy-function",
    "union-attr",
    "valid-type",
    "var-annotated",
]
